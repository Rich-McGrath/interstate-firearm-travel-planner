<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d12" />

    <!-- Search and accessibility -->
    <meta
      name="description"
      content="Interstate Firearm Travel Planner — assess legal posture for interstate firearm transport under federal § 926A and state-specific frameworks. Informational only; not legal advice."
    />

    <!-- Open Graph (Facebook, Slack, Discord, iMessage, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interstate Firearm Travel Planner" />
    <meta
      property="og:description"
      content="The GPS for Gun Law. Assess interstate firearm transport against federal § 926A and state-specific frameworks. Informational only; not legal advice."
    />
    <meta property="og:image" content="/web-app-manifest-512x512.png" />
    <meta property="og:image:alt" content="Interstate Firearm Travel Planner" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Interstate Firearm Travel Planner" />
    <meta
      name="twitter:description"
      content="The GPS for Gun Law. Assess interstate firearm transport against federal § 926A and state-specific frameworks. Informational only; not legal advice."
    />
    <meta name="twitter:image" content="/web-app-manifest-512x512.png" />

    <!-- Icons. The SVG favicon variant was intentionally removed:
         the source file embedded a 1059x1059 raster PNG inside an SVG
         wrapper (~9.6 MB), which every visitor downloaded on first
         paint. PNG fallbacks render the tab icon at the sizes
         browsers actually use (16/32/96 px). -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Interstate Firearm Travel Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
